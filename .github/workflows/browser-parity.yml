name: Browser parity
on:
  pull_request:
  push:
    branches: [main, codex/ai-dev-browser-parity]
  workflow_dispatch:
    inputs:
      live_model:
        description: Run paid real-model steering on Linux (requires ANTHROPIC_API_KEY)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"
  ADB_TEST_CHROME_ARGS: --no-sandbox

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/ai-dev-browser
          ref: 94170d23f65f5f9140792d1de4a158c086a39325
          path: .parity-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Preserve Chrome application bundle on macOS
        shell: python
        env:
          INSTALLED_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          import os, pathlib, shutil
          executable = pathlib.Path(os.environ['INSTALLED_CHROME'])
          if os.environ['RUNNER_OS'] == 'macOS':
              # setup-chrome relocates Contents into a directory without .app.
              # Chrome's renderer helpers fail in that layout; preserve a bundle.
              bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Parity Chrome.app'
              shutil.copytree(executable.parents[2], bundle, symlinks=True)
              executable = bundle / 'Contents' / 'MacOS' / executable.name
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'PARITY_CHROME={executable}\n')
      - name: Install reference test dependencies
        run: python -m pip install websockets websocket-client Pillow deprecated psutil cryptography rapidfuzz
      - name: Test bounded process capture
        run: python scripts/test_parity_process.py
      - name: Install Linux native-input prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build CLI and check command declarations
        id: build
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          cargo build -p sudohand-cli
          cargo test -p sudohand-cli --test browser_dispatch
          cargo test -p sudohand-cli parity_defaults
          executable=target/debug/suh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=target/debug/suh.exe; fi
          python scripts/cli_parity.py --suh "$executable" --reference .parity-reference --check-defaults sudohand-cli/tests/fixtures/browser-cli-defaults.json
          python scripts/pool_parity.py --reference .parity-reference --fixture crates/sudohand-browser/tests/fixtures/pool-scheduler.json
      - name: CLI steering and browser migration foundation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          executable=target/debug/suh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=target/debug/suh.exe; fi
          python -u scripts/live_browser_foundation.py --suh "$executable" --output artifacts/foundation
      - name: Real-model steering (explicitly requested)
        if: ${{ inputs.live_model && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo 'ANTHROPIC_API_KEY is required; live acceptance did not run'; exit 1; }
          npm install --global @anthropic-ai/claude-code@2.1.286
          python -u scripts/live_cli_steering.py --client claude --suh target/debug/suh --output artifacts/model
      - name: Preserve steering and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steering-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
      - name: CLI output closes before Chrome exits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          executable=target/debug/suh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=target/debug/suh.exe; fi
          python scripts/stdio_parity.py --suh "$executable"
      - name: Real browser and SDK regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          cargo test -p sudohand-browser -- --test-threads=4
      - name: Differential cookies, identity, proxy, cleanup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          executable=target/debug/suh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=target/debug/suh.exe; fi
          python -u scripts/browser_parity.py --suh "$executable" --reference .parity-reference
      - name: Page and navigation contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          executable=target/debug/suh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=target/debug/suh.exe; fi
          python -u scripts/page_parity.py --suh "$executable" --reference .parity-reference
      - name: Real extension transport
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          executable=target/debug/suh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=target/debug/suh.exe; fi
          python -u scripts/extension_parity.py --suh "$executable" --chrome "$AI_DEV_BROWSER_CHROME" --reference .parity-reference --startup-only
          python -u scripts/extension_parity.py --suh "$executable" --chrome "$AI_DEV_BROWSER_CHROME" --reference .parity-reference

      - name: Click fallback and typing contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          executable=target/debug/suh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=target/debug/suh.exe; fi
          python -u scripts/click_parity.py --suh "$executable" --reference .parity-reference
      - name: Verified typing contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          executable=target/debug/suh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=target/debug/suh.exe; fi
          python -u scripts/typing_parity.py --suh "$executable" --reference .parity-reference
      - name: Real native mouse under Xvfb
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          python -m pip install pyautogui
          xvfb-run -a -s '-screen 0 1920x1080x24' python -u scripts/click_parity.py --suh target/debug/suh --reference .parity-reference --native

      - name: Real native mouse on Windows
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        shell: bash
        env:
          AI_DEV_BROWSER_CHROME: ${{ env.PARITY_CHROME }}
        run: |
          python -m pip install pyautogui
          python -u scripts/click_parity.py --suh target/debug/suh.exe --reference .parity-reference --native
