[package]
name = "sudohand-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop actuator: window list, accessibility tree, synthetic input, screenshots (absorbs adc / ai-desktop-control)."

[features]
default = []
# `agent`: VLM-assisted element location (`vlm`) + the geometry/window helpers
# in `workflow`. Pulls in reqwest for the VLM HTTP calls; off by default,
# enabled by sudohand-cli. (Workflow orchestration lives in `sudohand-flow`.)
agent = ["dep:reqwest", "dep:serde_json"]

[dependencies]
sudohand-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.10"
core-graphics = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSObject", "NSEnumerator", "NSURL", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "NSPasteboard", "libc", "objc2-core-foundation"] }
