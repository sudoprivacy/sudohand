<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form Fixture</title>
<style>body{font-family:sans-serif;margin:24px} label{display:block;margin-top:12px} .hidden{display:none}</style>
</head>
<body>
<h1>Sign up</h1>
<form id="signup" action="result.html" method="get">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" placeholder="Your name">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <label for="bio">Bio</label>
  <textarea id="bio" name="bio" rows="3"></textarea>
  <label for="plan">Plan</label>
  <select id="plan" name="plan">
    <option value="free">Free</option>
    <option value="pro">Pro</option>
  </select>
  <label><input type="checkbox" name="tos" id="tos">I agree to the terms</label>
  <fieldset>
    <legend>Contact</legend>
    <label><input type="radio" name="contact" value="email" checked>By email</label>
    <label><input type="radio" name="contact" value="phone">By phone</label>
  </fieldset>
  <input class="hidden" type="text" name="honeypot">
  <button type="submit" id="submit">Create account</button>
  <button type="button" id="reset" onclick="document.getElementById('signup').reset()">Reset</button>
</form>
<p id="status" aria-live="polite"></p>
<script>
  document.getElementById('username').addEventListener('input', e => {
    document.getElementById('status').textContent = 'typed:' + e.target.value;
  });
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('status').textContent = 'enter:' + e.target.value;
  });
</script>
</body>
</html>
