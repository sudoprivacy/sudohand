[package]
name = "sudohand-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The `suh` umbrella CLI — dispatches to the browser/desktop/fs/shell actuators."

[[bin]]
name = "suh"
path = "src/main.rs"

[dependencies]
sudohand-core = { workspace = true }
sudohand-desktop = { workspace = true, features = ["agent"] }
sudohand-browser = { workspace = true }
sudohand-fs = { workspace = true }
sudohand-shell = { workspace = true }
sudohand-ext = { workspace = true }
sudohand-vlm = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "process", "time"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }
